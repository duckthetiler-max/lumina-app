<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app paint under the notch and home
         indicator once installed; the CSS then pads with env(safe-area-inset-*).
         Without it iOS letterboxes a standalone app with bars top and bottom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Installed-app behaviour. Without apple-mobile-web-app-capable, Add to
         Home Screen on iPhone opens Lumina INSIDE Safari with the address bar —
         the manifest's display:standalone is not enough on iOS. The translucent
         status bar is what lets the app run edge to edge (paired with the
         safe-area padding in index.css). -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lumina" />

    <title>Lumina | Calm Stim Feed</title>
    <meta
      name="description"
      content="Lumina is a calming stim feed for ADHD nervous-system regulation."
    />

    <!-- Browser chrome. This used to be a single #efe8dc left over from a
         retired cream palette, so Android painted a cream status bar above a
         deep-navy app and the install splash flashed cream. Both values now
         track --bg for the matching theme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7f9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12151c" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <!-- Without this iOS uses a screenshot of the page as the home-screen icon. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Link previews. With no og tags a pasted link renders as a bare grey
         card in Messages/Instagram/Discord. Absolute URLs are required by the
         spec, so these name the live Pages host directly — update them if
         Lumina ever moves to its own domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lumina" />
    <meta property="og:title" content="Lumina — a calm stim feed" />
    <meta
      property="og:description"
      content="25 sensory instruments for ADHD nervous-system regulation. No accounts, no tracking, works offline."
    />
    <meta property="og:url" content="https://duckthetiler-max.github.io/lumina-app/" />
    <meta
      property="og:image"
      content="https://duckthetiler-max.github.io/lumina-app/og-card.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The Lumina mark: concentric teal ripples around a glowing core." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lumina — a calm stim feed" />
    <meta
      name="twitter:description"
      content="25 sensory instruments for ADHD nervous-system regulation. No accounts, no tracking, works offline."
    />
    <meta
      name="twitter:image"
      content="https://duckthetiler-max.github.io/lumina-app/og-card.png"
    />
    <script type="module" crossorigin src="/lumina-app/assets/index-BT4HKf8m.js"></script>
    <link rel="stylesheet" crossorigin href="/lumina-app/assets/index-DEBA0TjP.css">
  <link rel="manifest" href="/lumina-app/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/lumina-app/registerSW.js"></script></head>
  <body>
    <div id="root"></div>
  </body>
</html>
